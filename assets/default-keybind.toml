force_quit = ["ctrl-c"]
quit = ["q"]
help_toggle = ["?","f1"]
cancel = ["esc"]
close = ["backspace"]

navigate_up = ["k", "up"]
navigate_down = ["j", "down"]
navigate_right = ["l", "right"]
navigate_left = ["h", "left"]
go_to_parent = ["alt-j", "alt-down"]
go_to_next_branch = ["]"]
go_to_previous_branch = ["["]
# first-parent lineage navigation; tipward forks open a chooser
lineage_root = ["}"]
lineage_tip = ["{"]
select_up = ["shift-k"]
select_down = ["shift-j"]

go_to_top = ["g"]
go_to_bottom = ["shift-g"]
scroll_down = ["ctrl-e"]
scroll_up = ["ctrl-y"]
page_up = ["ctrl-b", "pageup"]
page_down = ["ctrl-f", "pagedown"]
half_page_up = ["ctrl-u"]
half_page_down = ["ctrl-d"]
select_top = ["shift-h"]
select_middle = ["shift-m"]
select_bottom = ["shift-l"]

go_to_next = ["n"]
go_to_previous = ["shift-n"]
confirm = ["enter"]
ref_list = ["tab"]
worktree_list = ["w"]
# edit the selected changed file's working-tree version in commit details
edit_file = ["e"]
search = ["/"]
search_target_toggle = ["ctrl-t"]
ignore_case_toggle = ["ctrl-g"]
fuzzy_toggle = ["ctrl-x"]
mark_toggle = ["m"]
refresh = ["shift-r"]
# switch to the branch at the selected commit; pages down in views without a branch
switch_branch = ["space"]
# narrow or widen the graph column
graph_narrower = ["<"]
graph_wider = [">"]

# deletion always asks for confirmation; force deletion is local-only
delete_branch = ["d"]
